name: Production uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STOREFRONT_HEALTH_URL: ${{ vars.STOREFRONT_HEALTH_URL }}
      PLATFORM_HEALTH_URL: ${{ vars.PLATFORM_HEALTH_URL }}
    steps:
      - name: Check storefront and platform readiness
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STOREFRONT_HEALTH_URL" || { echo 'Set the STOREFRONT_HEALTH_URL repository variable'; exit 1; }
          test -n "$PLATFORM_HEALTH_URL" || { echo 'Set the PLATFORM_HEALTH_URL repository variable'; exit 1; }
          for url in "$STOREFRONT_HEALTH_URL" "$PLATFORM_HEALTH_URL"; do
            body="$(curl --fail --silent --show-error --location --max-time 15 --retry 2 --retry-all-errors "$url")"
            node -e 'const body=JSON.parse(process.argv[1]); if(body.ok!==true || body.ready===false) process.exit(1)' "$body"
          done
