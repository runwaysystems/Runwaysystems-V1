<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Runway Systems social preview</title>
  <desc id="desc">Dark branded social preview card for Runway Systems with subtle gold diagonal lines, the official ledger fold mark, the Runway Systems wordmark, and the tagline Calm systems for busy businesses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C10"/>
      <stop offset="100%" stop-color="#11151D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#C9A227" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diag" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#C9A227" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DDB32A"/>
      <stop offset="70%" stop-color="#F3DEA0"/>
      <stop offset="100%" stop-color="#E8C95E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#diag)"/>
  <rect x="0" y="0" width="1200" height="1.5" fill="#C9A227" fill-opacity="0.7"/>
  <rect x="0" y="628.5" width="1200" height="1.5" fill="#C9A227" fill-opacity="0.7"/>
  <circle cx="592" cy="315" r="188" fill="url(#glow)"/>

  <g transform="translate(338 214)">
    <g transform="scale(1.82)">
      <path fill="#C9A227" fill-rule="evenodd" d="M9 10h28l15 14v16L43 49l9 21H33l-8-19v19H9V10zm16 14v13h10l4-4v-5l-4-4H25z"/>
      <path fill="#C9A227" opacity=".55" d="M70 10H49L38 21v14l11 9h8l3 3v4l-4 5H40L28 70h32l11-14V40l-11-9h-8l-3-3v-3l4-4h17V10z"/>
      <path fill="none" stroke="#F0D98E" stroke-width=".8" opacity=".55" d="M40 8v64"/>
    </g>

    <text x="190" y="106" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="2">RUNWAY SYSTEMS</text>
    <text x="192" y="148" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="6">CALM SYSTEMS FOR BUSY BUSINESSES</text>
  </g>
</svg>
