name: D1 backup

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashflow-os
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: ${{ vars.CLOUDFLARE_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cashflow-os/package-lock.json
      - run: npm ci
      - name: Validate backup configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$BACKUP_BUCKET" || { echo 'Missing CLOUDFLARE_BACKUP_BUCKET repository variable'; exit 1; }
      - name: Export and upload encrypted-at-rest D1 backup
        run: |
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          mkdir -p backups
          npx --no-install wrangler d1 export cashflow-os-platform --remote --config worker/wrangler.toml --output "backups/d1-${stamp}.sql"
          gzip -9 "backups/d1-${stamp}.sql"
          npx --no-install wrangler r2 object put "${BACKUP_BUCKET}/d1/${stamp}.sql.gz" --remote --file "backups/d1-${stamp}.sql.gz"
          rm -f "backups/d1-${stamp}.sql.gz"
